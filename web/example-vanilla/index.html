<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CUE — vanilla host</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>CUE</h1>
      <p>Independent host page: plain HTML and one ES module. Nothing loads until you press Play.</p>
    </header>

    <main>
      <div id="cue-root" class="stage" data-state="idle">
        <button id="play" class="play" type="button">Play</button>
      </div>

      <div class="controls" role="toolbar" aria-label="Game controls">
        <button id="pause" type="button" disabled>Pause</button>
        <button id="rerack" type="button" disabled>Re-rack</button>
        <button id="destroy" type="button" disabled>Destroy</button>
      </div>

      <section class="metrics" aria-labelledby="metrics-title">
        <h2 id="metrics-title">Measurements</h2>
        <dl id="metrics"></dl>
      </section>

      <section aria-labelledby="log-title">
        <h2 id="log-title">Events</h2>
        <ol id="log" class="log" aria-live="polite"></ol>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
