<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CUE — Vite host</title>
    <style>
      html, body { margin: 0; background: #0b0c10; color: #f3f1ec; font: 15px/1.5 system-ui, sans-serif; }
      main { display: grid; gap: 12px; padding: 16px; max-width: 1200px; margin: 0 auto; }
      cue-game { border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>CUE in a Vite app</h1>
      <p>One tag. The engine downloads as the table comes into view, and pauses while it is out of sight.</p>
      <cue-game mode="free-play"></cue-game>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
