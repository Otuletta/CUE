[package]
name = "cue-web"
description = "WebAssembly bridge for CUE: mounting, lifecycle and events for host pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy.workspace = true
cue-audio.workspace = true
cue-core.workspace = true
cue-game.workspace = true
cue-physics.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "GainNode",
] }

[lints]
workspace = true
