name: CI

on:
  push:
    branches: [main]
    # Documentation is not part of the build or the deployed demo.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Toolchain comes from rust-toolchain.toml; rustup installs it on first use.
      - name: Bevy system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Physics stress test (1,000 shots)
        run: cargo test -p cue-physics --release --locked -- --ignored

  wasm:
    name: browser bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: wasm-bindgen CLI (must match Cargo.lock)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wrapper tests
        run: node --test 'web/package/test/*.test.mjs'
      - name: Build web/dist
        run: scripts/build-web.sh
      # The page lifecycle in Chrome against the bundle just built: mounting,
      # pausing, cancelling, failures and destroying (spec §17.3, §18.4).
      - name: Browser end-to-end tests
        working-directory: web/e2e
        run: |
          npm ci
          npm test
      # The npm tarball, installed into a fresh Vite app and built (spec §17.2, §26.2).
      - name: Clean consumer
        run: scripts/consumer-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cue-web-dist
          path: web/dist
          retention-days: 14
      - name: Package for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deny:
    name: licenses · advisories · sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Publishes the example host at https://otuletta.github.io/CUE/.
  # Runs only for main, and only when every other job is green.
  pages:
    name: deploy demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, wasm, deny]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
