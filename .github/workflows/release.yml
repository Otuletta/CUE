name: Release

# Push a tag such as v1.0.0 (matching the workspace version) to build, test and
# publish a GitHub release with the npm tarball, the demo and checksums.
# Publishing to npm stays a deliberate, manual step (docs/releasing.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bevy system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The tag matches the workspace version
        run: |
          version=$(awk -F'"' '/^\[workspace.package\]/ { found = 1 } found && /^version/ { print $2; exit }' Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, workspace $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p cue-physics --release --locked -- --ignored
          node --test 'web/package/test/*.test.mjs'

      - name: Build and check the package
        run: |
          scripts/build-web.sh
          scripts/consumer-test.sh
          (cd web/e2e && npm ci && npm test)

      - name: Assemble the release files
        run: |
          mkdir release
          (cd web/dist/package && npm pack --pack-destination ../../../release)
          (cd web/dist && zip -qr "../../release/cue-demo-$VERSION.zip" .)
          (cd release && sha256sum * > SHA256SUMS)
          # This version's section of the changelog becomes the release notes.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > release/NOTES.md
          test -s release/NOTES.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --title "CUE $VERSION" --notes-file release/NOTES.md $prerelease \
            release/*.tgz release/*.zip release/SHA256SUMS
