# cargo-deny: licences, security advisories and dependency sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Each ignore states why it does not affect CUE and when it goes away.
ignore = [
    # ruzstd 0.8 (zstd decoder, DoS on crafted input) via bevy_image's KTX2
    # support. CUE only decodes its own bundled assets, never user uploads.
    # Removed once Phase 1 trims Bevy features (zstd/ktx2) or Bevy bumps it.
    { id = "RUSTSEC-2026-0344", reason = "only trusted bundled assets are decoded; drop with Bevy feature trimming" },
    # ttf-parser unmaintained, via winit's Linux Wayland window decorations.
    # Not present in the web build.
    { id = "RUSTSEC-2026-0192", reason = "native Linux decorations only; not in the WASM artefact" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Permissive licences compatible with redistributing CUE as MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
